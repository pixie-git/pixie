# Development Docker Compose
# Usage: docker compose up

services:
  mongo:
    image: mongo:7
    container_name: pixie-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - pixie-net

  mongo-express:
    image: mongo-express:latest
    container_name: pixie-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    networks:
      - pixie-net

  redis:
    image: redis:7-alpine
    container_name: pixie-redis
    networks:
      - pixie-net

  server-a:
    build:
      context: ./server
      target: dev-stage
    container_name: pixie-server-a
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/pixie
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: dev-secret-key
      SERVER_ID: server-a
      REDIS_URL: redis://redis:6379
    volumes:
      - ./server/src:/app/src
      - ./server/pixie-api.yaml:/app/pixie-api.yaml
    depends_on:
      - mongo
      - redis
    networks:
      - pixie-net
    command: npm run dev

  server-b:
    build:
      context: ./server
      target: dev-stage
    container_name: pixie-server-b
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/pixie
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: dev-secret-key
      SERVER_ID: server-b
      REDIS_URL: redis://redis:6379
    volumes:
      - ./server/src:/app/src
      - ./server/pixie-api.yaml:/app/pixie-api.yaml
    depends_on:
      - mongo
      - redis
    networks:
      - pixie-net
    command: npm run dev

  nginx:
    image: nginx:alpine
    container_name: pixie-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-a
      - server-b
    networks:
      - pixie-net

  client:
    build:
      context: ./client
      target: dev-stage
    container_name: pixie-client
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
    depends_on:
      - nginx
    networks:
      - pixie-net
    command: npm run dev -- --host

volumes:
  mongo-data:

networks:
  pixie-net:
