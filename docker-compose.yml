# Development Docker Compose
# Usage: docker compose up

services:
  mongo:
    image: mongo:7
    container_name: pixie-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - pixie-net

  mongo-express:
    image: mongo-express:latest
    container_name: pixie-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    networks:
      - pixie-net

  redis:
    image: redis:7-alpine
    container_name: pixie-redis
    networks:
      - pixie-net

  server:
    build:
      context: ./server
      target: dev-stage
    image: pixie-server:dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/api-docs`)"
      - "traefik.http.services.server.loadbalancer.server.port=3000"
      - "traefik.http.services.server.loadbalancer.strategy=p2c"
      - "traefik.http.services.server.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.server.loadbalancer.sticky.cookie.name=PIXIE_SESSION"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/pixie
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: dev-secret-key
      REDIS_URL: redis://redis:6379
    volumes:
      - ./server/src:/app/src
      - ./server/pixie-api.yaml:/app/pixie-api.yaml
    depends_on:
      - mongo
      - redis
    networks:
      - pixie-net
    command: npm run dev

  traefik:
    image: traefik:latest
    container_name: pixie-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:3000"
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pixie-net

  client:
    build:
      context: ./client
      target: dev-stage
    container_name: pixie-client
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
    depends_on:
      - traefik
    networks:
      - pixie-net
    command: npm run dev -- --host

volumes:
  mongo-data:

networks:
  pixie-net:
